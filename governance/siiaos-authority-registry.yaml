      - evidence

known_conflicts:
  - id: LICENCE-UNIVERSITE-LIBRE-001
    status: unresolved
    subject: default_public_licence
    left: >-
      The current universite-libre README and governance/licence.md state that the
      final public licence is not yet fixed.
    right: >-
      The 2026-07-31 SIIAOS community charter recommends CC BY-SA 4.0 by default
      for explicitly published public SIIAOS content, with explicit exclusions.
    rule: >-
      Do not silently change repository licensing. Resolve this conflict explicitly
      before declaring existing university content to be a licensed SIIAOS common.
