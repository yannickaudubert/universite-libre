  - id: SIIAOS-ARCHITECTURE-HANDOFF-2026-08-30
    source_title: SIIAOS_ARCHITECTURE_AI_HANDOFF_2026-08-30
    date: 2026-08-30
    authority_class: HANDOFF_AND_SUCCESSION_RECORD
    status: active_reference
    scope:
