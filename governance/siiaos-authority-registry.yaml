schema: siiaos.authority-registry.v0.1
status: working
observed_at: 2026-09-08
purpose: >-
  Resolve the SIIAOS constitutional, governance, rights, licensing and evidence
  authorities without copying their full content into every project repository.

rules:
  - A project repository inherits shared SIIAOS rules by reference and declares only local specializations.
  - Copying an authority into a project repository does not create a new authority.
  - A newer synthesis does not silently repeal an older constitutional invariant.
  - Constitution, accepted decisions, observed implementation, prototypes and historical material remain distinct.
  - Project-specific data, client data and secrets never become commons by inheritance.

authorities:
  - id: SIIAOS-CONSTITUTION-2026-08-23
    source_title: SIIAOS_CAHIER_DES_CHARGES_MAITRE_v0.1
    date: 2026-08-23
    authority_class: CONSTITUTION
    status: active_reference
    scope:
      - finalities
      - constitutional_invariants
      - anti_objectives
      - constitutional_requirements
      - governance
      - rights
      - security
      - evidence
      - instances
    notes: >-
      Detailed master baseline. Includes the 12 constitutional invariants,
      constitutional requirements, instance requirements and the amendment procedure.

  - id: SIIAOS-COMMUNITY-CHARTER-1.0
    source_title: Charte_SIIAOS_communaute_licences_v1.0
    date: 2026-07-31
    authority_class: COMMUNITY_AND_LICENSING_CHARTER
    status: active_reference
    scope:
      - contributions
      - authorship
      - public_content
      - client_confidentiality
      - licensing_guidance
      - moderation
    notes: >-
      Separates shared knowledge, software, data, professional services,
